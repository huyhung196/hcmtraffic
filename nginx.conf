server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /cameras.json {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /camera-image/hcmc/ {
        proxy_pass https://giaothong.hochiminhcity.gov.vn:8007/;
        proxy_ssl_server_name on;
        proxy_ssl_name giaothong.hochiminhcity.gov.vn;
        proxy_ssl_verify off;
        proxy_set_header Host giaothong.hochiminhcity.gov.vn:8007;
        proxy_set_header Referer "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
    }

    location /camera-image/legacy/ {
        proxy_pass http://camera.thongtingiaothong.vn/;
        proxy_set_header Host camera.thongtingiaothong.vn;
        proxy_set_header Referer "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
